<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文章 — Shuxuan</title>
    <meta name="description" content="Shuxuan 的文章详情页。" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/markdown.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <!-- Theme (inline to avoid FOUC) -->
    <script src="./js/theme.js"></script>
</head>

<body>

    <!-- ========== Header ========== -->
    <header class="site-header">
        <div class="container">
            <a href="./index.html" class="site-header__logo">Shuxuan</a>
            <nav class="site-header__nav">
                <a href="./index.html#about">关于</a>
                <a href="./index.html#articles">文章</a>
                <a href="./index.html#projects">作品</a>
                <a href="./index.html#photos">相册</a>
                <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">
                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    <!-- ========== Post Content ========== -->
    <main class="post-page">
        <a href="./index.html" class="post-page__back">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12" />
                <polyline points="12 19 5 12 12 5" />
            </svg>
            返回首页
        </a>

        <div class="post-meta" id="post-meta"></div>

        <article id="post-content" class="markdown-body">
            <!-- Content rendered by renderer.js -->
        </article>

        <nav class="post-navigation hidden" id="post-navigation">
            <a href="#" id="nav-prev" class="nav-link hidden">
                <span class="nav-label">上一篇</span>
                <span class="nav-title" id="nav-prev-title"></span>
            </a>
            <a href="./index.html" class="nav-link nav-home">
                <span class="nav-label">返回</span>
                <span class="nav-title">首页</span>
            </a>
            <a href="#" id="nav-next" class="nav-link hidden">
                <span class="nav-label">下一篇</span>
                <span class="nav-title" id="nav-next-title"></span>
            </a>
        </nav>



    </main>

    <!-- ========== Back to Top Button ========== -->
    <button id="back-to-top" class="back-to-top" aria-label="回到顶部">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <!-- ========== Footer ========== -->
    <footer class="site-footer">
        <p>©2026 Shuxuan. All rights reserved.</p>
    </footer>

    <!-- marked.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-footnote/dist/index.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension/lib/index.umd.js"></script>
    <!-- Renderer -->
    <script src="./js/renderer.js"></script>

</body>

</html>
